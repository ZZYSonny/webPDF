# Build the demo, publish it to GitHub Pages, and pack the extension.
#
# Pages is configured to take its source from Actions (Settings -> Pages ->
# Source: "GitHub Actions"), so this workflow is the only thing that writes to
# the site: there is no `gh-pages` branch to keep in sync.
#
# It builds; it does not test. The suites - especially the browser one, which
# downloads the example paper and rasterises pages - belong on a machine where a
# flake costs nothing, not between a commit and the published site. Typechecking
# stays, because a type error means the artifact would be built from source that
# does not compile as written.
#
# The published site is the demo app plus the library it is built from, and it
# carries no documents of its own: every paper it offers is fetched from its
# public URL. Nothing in this repository is a PDF, so there is no corpus for the
# build to ship, and the PDF cache the tests use is not consulted here at all.
#
# The extension is built here too, and it is a *build*: the job produces the
# signed `.crx` and uploads it as an artifact. Nothing is released and nothing is
# published to the Chrome Web Store - the artifact is the deliverable, and anyone
# who wants the extension takes it from the run.
#
# One job for both, because they are two halves of the same thing: the extension
# frames the site this job publishes, so a run that ships a viewer and an
# extension that cannot draw with it is worse than a run that ships neither, and
# a failure in either build stops the deploy rather than publishing half of it.
# Set the `WEBPDF_EXT_KEY` secret to a PEM private key to keep the extension id
# stable from one run to the next (and therefore the reader's remembered
# positions with it); without it each run generates a key, prints the id it
# produced, and produces an extension the browser sees as a new one.

name: Pages

on:
  push:
    branches: [main]
  # Lets a deploy be re-run from the Actions tab without pushing a commit.
  workflow_dispatch:

# `pages: write` and `id-token: write` are what `deploy-pages` needs; nothing
# here needs write access to the repository itself.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, pack and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v6
      # Typechecking is part of the build here: a type error means the artifact
      # would be built from source that does not compile as written.
      - run: npm run typecheck
      - run: npm run build:pages
      # The extension, from the same commit as the site it frames: compile the
      # worker and the viewer page, then stage and sign the package - a staged
      # dist/ext/webpdf, a .zip beside it, and the .crx that is uploaded.
      - run: npm run build:extension
        env:
          # Empty when the secret is not set, which the build reads as "make one
          # for this run" - the id it produced is printed in the log either way.
          WEBPDF_EXT_KEY: ${{ secrets.WEBPDF_EXT_KEY }}
      - uses: actions/upload-artifact@v5
        with:
          name: webpdf-extension
          # The crx is the artifact: it is the signed, installable extension. The
          # staged directory and the zip stay on the runner (a zip of a crx is not
          # what a browser installs).
          path: dist/ext/*.crx
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/demo
          retention-days: 1
      # The deployment environment, and its URL, come from this step: it is the
      # only thing that knows where the site ended up.
      - id: deployment
        uses: actions/deploy-pages@v5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
