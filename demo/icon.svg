<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="webpdf">
  <title>webpdf</title>
  <!--
    The project in one mark: a page, and the text this renderer puts back into
    it - three lines, each held at the front (bionic reading's fixation point)
    and faded behind it. The first fixation is the accent colour, so the mark
    still reads as a mark at 16 px in a browser tab.
  -->
  <rect width="64" height="64" rx="14" fill="#171a21" />
  <path d="M18 8h20l12 12v34a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4z" fill="#e8eaf0" />
  <path d="M38 8l12 12H41a3 3 0 0 1-3-3z" fill="#b9c0cf" />
  <rect x="20" y="26" width="10" height="4" rx="2" fill="#4f8cff" />
  <rect x="32" y="26" width="16" height="4" rx="2" fill="#9aa3b5" />
  <rect x="20" y="36" width="8" height="4" rx="2" fill="#0f1115" />
  <rect x="30" y="36" width="18" height="4" rx="2" fill="#9aa3b5" />
  <rect x="20" y="46" width="11" height="4" rx="2" fill="#0f1115" />
  <rect x="33" y="46" width="13" height="4" rx="2" fill="#9aa3b5" />
</svg>
