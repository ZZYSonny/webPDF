[package]
name = "webpdf-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "The PDF core of webPDF: MuPDF in Rust, emitting the page's final SVG itself"

[lib]
# `rlib` only, and deliberately: the browser build is a *binary*
# (`src/bin/engine.rs`), because Emscripten links a binary as a main module and a
# `cdylib` as a side module - and only a main module can be started by the glue
# that sets this crate's C runtime up. A `cdylib` here is not merely unused, it
# is unbuildable: a side module wants position-independent code and MuPDF's C is
# not compiled with `-fPIC`, so the link fails the moment anything references it.
crate-type = ["rlib"]

[[bin]]
name = "webpdf-core"
path = "src/main.rs"

[dependencies]
# MuPDF, with everything this core does not draw left out at the source. The
# `mupdf` crate's defaults build XPS, SVG and image documents, CBZ, the
# HTML/EPUB/Office engine (and HarfBuzz and Gumbo under it), PDF JavaScript, the
# OCR pipeline and the DOCX writer; a reader of PDFs that emits its own SVG
# needs none of them, and a crate feature is the only honest way to say so -
# MuPDF's own `make` turns each one into `-D`s that keep the sources, the
# third-party libraries and the built-in tables out of the link.
#
# `base14-fonts` is the one that stays and is not optional: a PDF that does not
# embed its text fonts is ordinary, and the URW faces are what draws it.
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"] }
# The same MuPDF the safe wrapper links, for the calls it does not expose: a
# shading's own geometry and colour ramp, and a soft mask's transfer function.
# See `src/ffi.rs` for why those cannot be reached through `mupdf` alone.
mupdf-sys = "0.8"
# WOFF is a zlib stream per table. A pure-Rust deflate keeps the build free of C
# beyond MuPDF's own, which is what lets the same crate compile to wasm.
miniz_oxide = "0.8"
# Bionic reading: where a word's fixation points are, the way `text-vide` found
# them for the TypeScript pipeline this replaces. See `src/bionic.rs`.
bioneer = "0.1.1"
# The crop rules are regular expressions: a reader's list of them is compiled and
# matched against every text run on a page. Already in the tree through `bioneer`,
# so naming it here costs no build time and no second copy of the engine.
regex = "1"

[profile.release]
opt-level = 3

# The browser build. What it *does not* do is ask for smaller code: `-Oz` trades
# drawing speed for bytes, and this is a page renderer before it is a download.
# The code generation is the desktop release's, and the `-Oz` that mupdf-sys
# would have taken from `opt-level` is deliberately not asked for.
#
# What is free is the linking: one LTO module instead of many, one codegen unit,
# no unwind tables behind a Rust `panic` that would abort anyway, no symbols.
# `npm run build:wasm` uses it; `npm run build:wasm:dev` is the fast loop.
[profile.wasm-release]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The other half of that bargain: `npm run build:wasm:dev` links this one, where
# the build time is what hurts and nobody is paying for the bytes yet. The C is
# compiled unoptimized (the build script asks for `-O0` on top of whatever
# mupdf-sys would have used), and no LTO pass walks the module.
[profile.wasm-dev]
inherits = "dev"
opt-level = 0
debug = false
